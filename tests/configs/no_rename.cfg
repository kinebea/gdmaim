; Enable Obfuscation turned off, which leaves post-processing
; features=postprocessed

[obfuscator]

enabled=false

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
