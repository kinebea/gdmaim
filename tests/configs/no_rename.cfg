; Enable Obfuscation turned off, which leaves post-processing. Inline Constants and Inline Enums are
; part of what is off then
; features=postprocessed
; export_log_not=is a name that gets renamed

[obfuscator]

enabled=false
inline_constants=true
inline_enum_keys=true

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
