; Scripts as binary tokens and resources as binary files, both made by GDMaim
; features=renamed,postprocessed,binary
; export_log=Exporting scripts as binary tokens

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"
export_mode=1

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
