; Scripts as binary tokens and resources as binary files, both made by GDMaim.
; Check Exported Scripts has to find broken/after_export.gd in this form as well
; features=renamed,postprocessed,binary
; export_log=Exporting scripts as binary tokens
; export_log=GDMaim - res://broken/after_export.gd:9 does not compile once exported: Identifier "bonus_points" not declared in the current scope
; export_log=GDMaim - 1 of [0-9]+ exported scripts does not compile

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"
export_mode=1
verify_scripts=true

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
