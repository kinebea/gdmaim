; Scripts as binary tokens and resources as binary files, both made by GDMaim.
; Check Exported Scripts has to find broken/after_export.gd in this form as well, and the log of
; the game has to translate like the one of the configuration translate
; features=renamed,postprocessed,binary,crash
; export_log=Exporting scripts as binary tokens
; export_log=GDMaim - res://broken/after_export.gd:9 does not compile once exported: Identifier "bonus_points" not declared in the current scope
; export_log=GDMaim - 1 of [0-9]+ exported scripts does not compile, which keeps 1 more from compiling
; export_log_not=a_needs_broken\.gd:[0-9]+ does not compile
; translate_log=at: Engine_part\.heat_up \(res://broken/at_runtime\.gd:14\)
; translate_log=\[1\] start_engine \(res://broken/at_runtime\.gd:22\)
; translate_log=Invalid access to property or key 'fuel_level' on a base object of type 'RefCounted'
; translate_log=\[0\] drain_fuel \(res://broken/at_runtime\.gd:18\)
; translate_log=\[2\] _ready \(res://main\.gd:68\)

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"
export_mode=1
verify_scripts=true

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
