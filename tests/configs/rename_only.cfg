; Only renaming, everything else turned off. Nothing gets removed from broken/after_export.gd
; this way, so Check Exported Scripts has no script to report
; features=renamed
; export_log=GDMaim - All [0-9]+ exported scripts compile

[obfuscator]

export_vars=false
shuffle_top_level=false
inline_consts=false
inline_enums=false

[post_process]

strip_comments=false
strip_empty_lines=false
strip_extraneous_spacing=false
strip_editor_annotations=false
strip_sequential_newlines=false
regex_filter_enabled=false
feature_filters=false
verify_scripts=true

[id]

seed=1234

[source_mapping]

compress=false
inject_name=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
