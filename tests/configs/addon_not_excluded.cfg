; Exported without GDMaim, through a preset that does not leave the addon out: the export
; plugin has to do that then, and to remove the library of the addon which Godot puts next
; to the game. The plugin adds the addon to the filter of every preset when it is loaded.
; The filter here has it take that for done, while it matches no file
; features=no_gdmaim
; exclude_filter=res://addons/gdmaim/*.left_in
; export=game
