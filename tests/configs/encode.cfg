; Encode Strings turned on: every case has to do the same with its strings encoded. Check Exported
; Scripts is on as well, and must find nothing but broken/after_export.gd
; features=renamed,postprocessed,encoded
; export_log=GDMaim - 1 of [0-9]+ exported scripts does not compile

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"
encode_strings=true
verify_scripts=true

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
