; Like binary, with the tokens compressed, and with Encode Strings, Inline Constants and Inline Enums
; features=renamed,postprocessed,binary,encoded,inlined
; export_log=Exporting scripts as compressed binary tokens

[obfuscator]

inline_constants=true
inline_enum_keys=true

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"
export_mode=2
encode_strings=true

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
