; Inline Constants and Inline Enums turned on: the values of constants and of the keys of enums
; are put where their names are used, which no case may notice. Encode Strings is on as well, for a
; string that is inlined to be encoded, and Check Exported Scripts, which must find nothing but
; broken/after_export.gd
; features=renamed,postprocessed,encoded,inlined
; export_log=GDMaim - 1 of [0-9]+ exported scripts does not compile, which keeps 1 more from compiling

[obfuscator]

inline_constants=true
inline_enum_keys=true

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"
encode_strings=true
verify_scripts=true

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
