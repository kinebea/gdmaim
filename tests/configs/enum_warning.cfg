; Inline Enums turned on in a project where GDScript takes a whole number in place of an enum for an
; error: the keys of enums with a name stay, as the exported scripts would not compile otherwise. The
; keys of an enum without a name are whole numbers, and are replaced
; features=renamed,postprocessed,inlined_loose
; project_setting=debug/gdscript/warnings/int_as_enum_without_cast=2
; export_log=GDMaim - Inline Enums leaves the keys of enums with a name as they are

[obfuscator]

inline_enum_keys=true

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
