; Inline Enums turned on in a project where GDScript takes a whole number in place of an enum for an
; error: the keys of enums stay, as the exported scripts would not compile otherwise
; features=renamed,postprocessed
; project_setting=debug/gdscript/warnings/int_as_enum_without_cast=2
; export_log=GDMaim - Inline Enums is left out

[obfuscator]

inline_enum_keys=true

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
