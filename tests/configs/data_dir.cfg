; A project that keeps the files of Godot in "godot" instead of ".godot", where the class cache
; with the renamed classes has to be written as well
; features=renamed,postprocessed
; project_setting=application/config/use_hidden_project_data_directory=false

[post_process]

regex_filter="DEBUG_ONLY|(?<!func )rf_trace[(]|print_debug[(]"

[id]

seed=1234

[source_mapping]

compress=false

[exclude_files_category]

multi_filepath="cases/export/left_alone.gd;res://cases/export/excluded"
