name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  export:
    name: Export and run (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # From the oldest version GDMaim is for to the newest
        godot: [4.5-stable, 4.6-stable, 4.7.2-stable]
    env:
      GODOT_VERSION: ${{ matrix.godot }}
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot
        run: |
          curl -sSfL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run the tests
        run: tests/run.sh

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.godot }}
          path: tests/.work/project/out
